[package]
name = "usb-watch"
version = "0.1.0"
description = "USB 機器の一覧・見張り・有効/無効の切り替え"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# 作業フォルダを大きくしない（ライブラリにはデバッグ用の情報を付けず、自分のコードは行番号だけ。2026-11-15）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
